// iBurley's CS2 Config
// Launch Commands: "gamemoderun %command% +exec autoexec"

// Keybind Commands
unbindall
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "`" "toggleconsole"
bind "a" "+left"
bind "b" "buymenu"
bind "c" "slot12"
bind "d" "+right"
bind "e" "+use"
bind "f" "drop"
bind "m" "teammenu"
bind "q" "lastinv"
bind "r" "+reload"
bind "s" "+back"
bind "t" "+spray_menu"
bind "u" "messagemode2"
bind "w" "+forward"
bind "x" "toggleradarscale"
bind "y" "messagemode"
bind "CAPSLOCK" "+duck"
bind "CTRL" "+duck"
bind "ESCAPE" "cancelselect"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+lookatweapon"
bind "MOUSE4" "+voicerecord"
bind "MOUSE5" "player_ping"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "SHIFT" "+sprint"
bind "SPACE" "+jump"
bind "TAB" "+showscores"

// Mouse Commands
sensitivity "0.519545"
zoom_sensitivity_ratio "0.818933027098955175"

// Crosshair Commands
cl_crosshair_drawoutline "1"
cl_crosshair_friendly_warning "0"
cl_crosshair_outlinethickness "1"
cl_crosshair_recoil "0"
cl_crosshair_t "0"
cl_crosshairalpha "255"
cl_crosshaircolor "5"
cl_crosshaircolor_b "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_r "255"
cl_crosshairdot "0"
cl_crosshairgap "-1"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairsize "2"
cl_crosshairstyle "4"
cl_crosshairthickness "1"
cl_crosshairusealpha "1"
cl_sniper_show_inaccuracy "0"

// HUD/Radar Commands
cl_hud_color "1"
cl_hud_radar_background_alpha ".9"
cl_hud_radar_scale "1"
cl_hud_telemetry_frametime_poor "7"
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_net_misdelivery_poor "1"
cl_hud_telemetry_net_misdelivery_show "2"
cl_hud_telemetry_ping_show "2"
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.7"
cl_radar_scale "0.4"
hud_scaling "1.1"

// Viewmodel Commands
viewmodel_fov "60"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"

// Audio Commands
snd_menumap_volume "0"
snd_musicvolume "0"
voice_modenable "1"
volume ".5"

// Network Commands
cl_net_buffer_ticks "0"
cl_net_buffer_ticks_use_interp "1"
engine_low_latency_sleep_after_client_tick "1"
rate "1000000"

// Prediction Commands
cl_predict_body_shot_fx "0"
cl_predict_head_shot_fx "0"
cl_predict_kill_ragdolls "0"

// Miscellaneous
cl_buywheel_nonumberpurchasing "1"
cl_color "0"
cl_dm_buyrandomweapons "0"
cl_obs_interp_enable "0"
cl_show_clan_in_death_notice "0"
cl_show_observer_crosshair "2"
cl_silencer_mode "0"
cl_use_opens_buy_menu "0"
con_enable "1"
fps_max "0"
fps_max_tools "144"
fps_max_ui "144"
mm_dedicated_search_maxping "25"
player_nevershow_communityservermessage "1"
r_fullscreen_gamma "2"

host_writeconfig

// Echo Commands
clear
echo "iBurley's CS2 Config Enabled"
