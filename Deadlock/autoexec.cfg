// iBurley's Deadlock Config
// Launch Commands: "PROTON_ENABLE_WAYLAND=1 gamemoderun %command% +exec autoexec"

// Mouse Commands
sensitivity "0.432954"
zoom_sensitivity_ratio "1"

// Crosshair Commands
citadel_crosshair_color_b "255"
citadel_crosshair_color_g "255"
citadel_crosshair_color_r "255"
citadel_crosshair_disable_hero_specific_crosshairs "1"
citadel_crosshair_dot_opacity "1"
citadel_crosshair_dot_outline_border "2"
citadel_crosshair_dot_outline_gap "0"
citadel_crosshair_dot_outline_opacity "1"
citadel_crosshair_dot_size "3"
citadel_crosshair_hit_marker_duration "0.1"
citadel_crosshair_outline_color_b "0"
citadel_crosshair_outline_color_g "0"
citadel_crosshair_outline_color_r "0"
citadel_crosshair_pip_gap "0"
citadel_crosshair_pip_gap_static "1"
citadel_crosshair_pip_height "0"
citadel_crosshair_pip_opacity "0"
citadel_crosshair_pip_outline_border "0"
citadel_crosshair_pip_outline_gap "0"
citadel_crosshair_pip_outline_opacity "0"
citadel_crosshair_pip_width "0"

// HUD Commands
cl_hud_telemetry_frametime_poor "7"
cl_hud_telemetry_frametime_show "2"
cl_hud_telemetry_net_misdelivery_poor "1"
cl_hud_telemetry_net_misdelivery_show "2"
cl_hud_telemetry_ping_show "2"

// Audio Commands
snd_musicvolume "0"
voice_modenable "1"
volume ".2"

// Network Commands
engine_low_latency_sleep_after_client_tick "1"
rate "1000000"

// Miscellaneous
citadel_camera_hero_fov "90" 
citadel_show_average_rating_on_postgame "1"
citadel_show_rating_notification_on_change "1"
citadel_unit_status_use_new "1"
con_enable "1"
fps_max "0"
fps_max_tools "144"
fps_max_ui "144"
r_fullscreen_gamma "2.1"

host_writeconfig

// Echo Commands
clear
echo "iBurley's Deadlock Config Enabled"
